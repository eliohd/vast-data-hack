[project]
name = "hack-server"
version = "0.1.0"
description = "FastAPI backend for the VAST Builders Challenge London video agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "openai>=3.33.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "weave>=0.53.12",
]

[project.optional-dependencies]
# Direct VastDB access (vss-collection reads, our own tables). Heavy (pyarrow), so opt-in:
#   uv sync --extra vast
vast = [
    "pyarrow<17",
    "vastdb==1.3.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
